name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, lint and type-check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      # PageProps/LayoutProps are generated by Next.js and not committed
      # (next-env.d.ts is gitignored), so generate them before type-checking.
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit
